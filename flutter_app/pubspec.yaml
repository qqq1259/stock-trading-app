name: stock_trading_app
description: 股票交易移动应用

# App版本信息
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # 基础UI
  cupertino_icons: ^1.0.2
  
  # 网络请求
  dio: ^5.3.2
  
  # 状态管理
  provider: ^6.0.5
  get: ^4.6.6
  
  # 本地存储
  shared_preferences: ^2.2.2
  
  # UI工具
  flutter_screenutil: ^5.9.0
  
  # 工具类
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  # 资源文件
  assets:
    - assets/images/
    

name: stock_trading_app
description: 股票交易移动应用

# App版本信息
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # UI组件库
  cupertino_icons: ^1.0.2
  material_design_icons_flutter: ^7.0.7296
  
  # 网络请求
  dio: ^5.3.2
  pretty_dio_logger: ^1.3.1
  
  # 状态管理
  provider: ^6.0.5
  get: ^4.6.6
  
  # 本地存储
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # 图表组件
  fl_chart: ^0.64.0
  
  # 图片加载和缓存
  cached_network_image: ^3.3.0
  
  # UI工具
  flutter_screenutil: ^5.9.0
  pull_to_refresh: ^2.0.0
  
  # 工具类
  intl: ^0.18.1
  crypto: ^3.0.3
  url_launcher: ^6.2.1
  device_info_plus: ^9.1.0
  package_info_plus: ^4.2.0
  
  # 权限管理
  permission_handler: ^11.0.1
  
  # WebView
  webview_flutter: ^4.4.2
  
  # 日志
  logger: ^2.0.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  # 资源文件
  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
    
  # 字体
  # fonts:
  #   - family: PingFang
  #     fonts:
  #       - asset: assets/fonts/PingFang-Regular.ttf 